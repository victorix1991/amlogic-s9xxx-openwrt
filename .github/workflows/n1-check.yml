name: Check N1 package set

# Muse 2026-11-28: quick gate (~15 min) that runs `make defconfig` on the ImmortalWrt master tree
# with this repo's config and checks the package set (msd_lite in; udpxy and the Wi-Fi stack out).
# Manual / hub dispatch only. The full build runs the same check plus a rootfs check.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      BR: immortalwrt_master
    steps:
      - uses: actions/checkout@v6

      - name: Install minimal build prerequisites
        run: |
          sudo apt-get -y update
          sudo apt-get -y install build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Clone ImmortalWrt and feeds
        run: |
          git clone -q --single-branch --depth=1 --branch=master https://github.com/immortalwrt/immortalwrt openwrt
          [ -f config/$BR/feeds.conf.default ] && cp -f config/$BR/feeds.conf.default openwrt/feeds.conf.default
          cd openwrt
          bash ../config/$BR/diy-part1.sh
          ./scripts/feeds update -a >/dev/null
          ./scripts/feeds install -a >/dev/null

      - name: Apply config and defconfig
        run: |
          cp -f config/$BR/config openwrt/.config
          cd openwrt
          bash ../config/$BR/diy-part2.sh "10.0.0.1" "false"
          make defconfig >/dev/null

      - name: Package-set check
        run: bash .github/muse/n1_check.sh config openwrt/.config
